name: Windows build and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and package
    if: ${{ !github.event.deleted }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure x64 build
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Package Windows ZIP
        run: cpack --config build/CPackConfig.cmake -C Release -G ZIP -B build/packages

      - name: Smoke-test executable from ZIP
        run: |
          Expand-Archive -LiteralPath build/packages/seam-carver-windows-x64.zip -DestinationPath build/package-smoke
          & ./build/package-smoke/seam-carver.exe --help

      - name: Upload tested ZIP
        uses: actions/upload-artifact@v7
        with:
          name: seam-carver-windows-x64
          path: build/packages/seam-carver-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: Publish Windows ZIP
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: seam-carver-windows-x64

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_TAG: ${{ github.ref_name }}
        run: gh release create "$VERSION_TAG" seam-carver-windows-x64.zip --verify-tag --generate-notes
